name: Build Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build fat JAR
        run: mvn package -DskipTests

      - name: Get version
        id: version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: target/photostat-java-${{ steps.version.outputs.version }}-executable.jar

      - name: Upload JAR to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "target/photostat-java-${{ steps.version.outputs.version }}-executable.jar" --clobber

    outputs:
      version: ${{ steps.version.outputs.version }}

  package-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: input

      - name: Create MSI installer
        shell: pwsh
        run: |
          jpackage `
            --input input `
            --main-jar "photostat-java-${{ needs.build.outputs.version }}-executable.jar" `
            --main-class com.photostat.Launcher `
            --name PhotoStat `
            --app-version "${{ needs.build.outputs.version }}" `
            --vendor "PhotoStat" `
            --description "Photo metadata indexing and search" `
            --type msi `
            --java-options "--add-opens javafx.graphics/com.sun.javafx.tk=ALL-UNNAMED" `
            --win-menu `
            --win-shortcut `
            --dest output

      - name: Upload MSI to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msi = Get-ChildItem output/*.msi | Select-Object -First 1
          gh release upload "${{ github.ref_name }}" $msi.FullName --clobber

  package-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: input

      - name: Create DMG installer
        run: |
          jpackage \
            --input input \
            --main-jar photostat-java-${{ needs.build.outputs.version }}-executable.jar \
            --main-class com.photostat.Launcher \
            --name PhotoStat \
            --app-version ${{ needs.build.outputs.version }} \
            --vendor "PhotoStat" \
            --description "Photo metadata indexing and search" \
            --type dmg \
            --java-options "--add-opens javafx.graphics/com.sun.javafx.tk=ALL-UNNAMED" \
            --dest output

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" output/*.dmg --clobber
