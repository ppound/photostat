# PhotoStat backend services using PREBUILT images (no repo clone required).
#
# This file is deployed to ~/.photostat/docker-compose.yml by PhotoStat.
# The images are published to GitHub Container Registry by CI, so you only need
# Docker installed — not the PhotoStat source tree.
#
# CPU (default):
#   docker compose -f ~/.photostat/docker-compose.yml up -d
#
# GPU (NVIDIA, optional):
#   docker compose -f ~/.photostat/docker-compose.yml -f ~/.photostat/docker-compose.gpu.yml up -d
#
# Start only what you need (opensearch is the only always-required service):
#   docker compose -f ~/.photostat/docker-compose.yml up -d opensearch aesthetic
#
# Model weights download on first start into the named volumes below, so the
# containers need no access to your photo files.
#
# SECURITY: every port below is published on 127.0.0.1 so the services are
# reachable only from this machine. OpenSearch runs with authentication
# disabled and the AI services accept unauthenticated requests, so binding to
# 0.0.0.0 (Docker's default for "9200:9200") would expose your photo index and
# those services to everyone on your network. Only widen this if you are
# running PhotoStat on a different machine from the containers, and put the
# services behind a firewall or auth if you do.

services:
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # PhotoStat defaults to host=localhost port=9200 ssl=false with no auth,
      # so run the dev-friendly insecure single-node configuration.
      - plugins.security.disabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  faces:
    image: ghcr.io/ppound/photostat-faces:2.6.2-cpu
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - faces-models:/models

  analysis:
    image: ghcr.io/ppound/photostat-analysis:2.6.2-cpu
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - hf-cache:/models

  aesthetic:
    image: ghcr.io/ppound/photostat-aesthetic:2.6.2-cpu
    ports:
      - "127.0.0.1:8003:8003"
    # Override the IQA metric here if desired (default CLIP-IQA+):
    #   environment:
    #     - PHOTOSTAT_IQA_METRIC=nima
    volumes:
      - iqa-models:/models

volumes:
  opensearch-data:
  faces-models:
  hf-cache:
  iqa-models:
